services:
  - type: web
    name: gehihiv2
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_EXTERNAL_HOSTNAME
        value: gehihiv2.onrender.com
      - key: RENDER_EXTERNAL_URL
        value: https://gehihiv2.onrender.com
      - key: WEBSOCKET_URL
        value: wss://gehihiv2.onrender.com/xiaozhi/v1/
      - key: UPSTREAM_WS_URL
        value: wss://gehihi.onrender.com/gehihi/v1/
